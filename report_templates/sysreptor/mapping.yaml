# Concrete field contract validated through reptor 0.36 against the
# "SysReptor Demo Calzone v1.2" design.  The pushproject document imports
# sections/findings; evidence files are uploaded separately with `reptor file`.

mapping_version: "2.0"
format: "reptor-pushproject"
validated_design: "SysReptor Demo Calzone v1.2"

sections:
  executive_summary:
    status: "finished"
    fields:
      executive_summary:
        type: "markdown"
        source: "semantic executive summary, methodology, objectives, attack path, limitations, cleanup and evidence references"
  scope:
    status: "finished"
    fields:
      scope:
        type: "markdown"
        source: "targets"
  other:
    status: "finished"
    fields:
      title:
        type: "string"
        source: "profile"
      report_date:
        type: "date"
        source: "generated_at"
      report_version:
        type: "string"
        value: "1.0"

findings:
  status:
    validated: "finished"
    other: "in-progress"
  fields:
    title:
      type: "string"
      source: "finding.title"
    cvss:
      type: "cvss"
      source: "finding.cvss_vector"
    affected_components:
      type: "list[string]"
      source: "finding.affected_assets"
    summary:
      type: "markdown"
      source: "finding.description and finding.impact"
    description:
      type: "markdown"
      source: "finding prerequisites, reproduction, evidence, impact and CWE"
    recommendation:
      type: "markdown"
      source: "finding.remediation"

evidence:
  bundle_path: "evidence/"
  manifest: "evidence-manifest.json"
  import_command: "reptor file evidence/*"
