# Ariadne integration test Compose — isolated test services for CI.
#
# Provides deterministic DNS, HTTP/HTTPS, redirect, SSH-banner, SMB/LDAP
# fixture outputs, authentication limits, one allowed host, and one
# discoverable blocked neighbor.  No service publishes outside loopback.
name: ariadne-integration

services:
  # ── Test target services ────────────────────────────────────────────
  target-http:
    image: python:3.11-alpine
    container_name: ariadne-int-http
    hostname: allowed.ariadne.test
    networks:
      testnet:
        ipv4_address: 10.10.10.10
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/server.py << 'PYEOF'
        import http.server
        import json
        import os
        import ssl
        import threading

        class TestHandler(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path == "/":
                    self._respond(200, b"<html><body><h1>Ariadne Test</h1></body></html>", "text/html")
                elif self.path == "/redirect":
                    self.send_response(302)
                    self.send_header("Location", "/target")
                    self.end_headers()
                elif self.path == "/target":
                    self._respond(200, b"Redirect target reached", "text/plain")
                elif self.path == "/auth-limited":
                    self._respond(429, b"Rate limit exceeded", "text/plain")
                elif self.path == "/.env":
                    self._respond(200, b"DATABASE_URL=postgres://test:test@localhost:5432/test", "text/plain")
                else:
                    self._respond(200, b"OK", "text/plain")

            def _respond(self, status: int, body: bytes, content_type: str) -> None:
                self.send_response(status)
                self.send_header("Content-Type", content_type)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, fmt, *args):
                pass  # suppress stderr noise

        server = http.server.HTTPServer(("0.0.0.0", 80), TestHandler)

        # Also serve HTTPS on 443 (self-signed)
        ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
        ctx.load_cert_chain("/tmp/cert.pem", "/tmp/key.pem")
        srv_ssl = http.server.HTTPServer(("0.0.0.0", 443), TestHandler)
        srv_ssl.socket = ctx.wrap_socket(srv_ssl.socket, server_side=True)

        t = threading.Thread(target=srv_ssl.serve_forever, daemon=True)
        t.start()
        server.serve_forever()
        PYEOF
        # Generate self-signed cert
        apk add openssl >/dev/null 2>&1
        openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem \
          -out /tmp/cert.pem -days 1 -nodes \
          -subj "/CN=allowed.ariadne.test" >/dev/null 2>&1
        python3 /tmp/server.py
    restart: "no"

  # ── SSH banner service ───────────────────────────────────────────────
  target-ssh:
    image: python:3.11-alpine
    container_name: ariadne-int-ssh
    networks:
      testnet:
        ipv4_address: 10.10.10.20
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/sshbanner.py << 'PYEOF'
        import socket
        s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        s.bind(("0.0.0.0", 22))
        s.listen(5)
        while True:
            conn, addr = s.accept()
            conn.sendall(b"SSH-2.0-OpenSSH_8.9p1 Ubuntu-3\r\n")
            conn.close()
        PYEOF
        python3 /tmp/sshbanner.py
    restart: "no"

  # ── SMB / LDAP stub ──────────────────────────────────────────────────
  target-smb:
    image: python:3.11-alpine
    container_name: ariadne-int-smb
    networks:
      testnet:
        ipv4_address: 10.10.10.30
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/smbstub.py << 'PYEOF'
        import socket
        s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        s.bind(("0.0.0.0", 445))
        s.listen(5)
        while True:
            conn, addr = s.accept()
            # SMB Negotiate Protocol Response stub
            conn.sendall(bytes.fromhex("00") + b"SMB")
            conn.close()
        PYEOF
        python3 /tmp/smbstub.py
    restart: "no"

  # ── Blocked neighbor (non-allowlisted host) ──────────────────────────
  neighbor-blocked:
    image: python:3.11-alpine
    container_name: ariadne-int-blocked
    networks:
      testnet:
        ipv4_address: 10.10.10.11
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/blocked.py << 'PYEOF'
        import http.server
        class BlockedHandler(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(b"You should not see this through netguard")
            def log_message(self, fmt, *args): pass
        server = http.server.HTTPServer(("0.0.0.0", 8080), BlockedHandler)
        server.serve_forever()
        PYEOF
        python3 /tmp/blocked.py
    restart: "no"

networks:
  testnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1
    # Explicitly no external access — this network is isolated
    enable_ipv6: false
