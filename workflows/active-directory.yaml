      operation: ldap_rootdse
      inputs: {}
  limits:
    max_rate: 10
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 120
    max_output_bytes: 10485760
  stop_conditions:
    - "ldap_enumerated"
    - "ldap_not_available"
  success_emits:
