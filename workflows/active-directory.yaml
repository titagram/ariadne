# AD high-impact operations
#
# Each of the following requires its exact capability in the policy.
# These are NOT enabled by generic ``ad.enum`` capability.

# Password spraying
- id: ad.password-spray.v1
  version: 1
  stage: validation
  triggers:
    - kind: observation_type
      types: ["validated_users"]
  required_evidence_types:
    - "validated_users"
  capabilities:
    - ad.password_spray
  actions:
    - adapter: active_directory
      operation: password_spray
      inputs:
        delay_seconds: 30
        max_attempts_per_user: 1
  limits:
    max_rate: 2
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 300
    max_output_bytes: 10485760
  stop_conditions:
    - "spray_complete"
    - "credential_found"
    - "lockout_risk_detected"
  success_emits:
    - "password_spray_results"
    - "compromised_credentials"
  next_playbooks:
    - foothold.confirmation.v1
  report_sections:
    - "active_directory"
    - "validation"

# Credential dumping (NTDS.dit, DCSync, SAM)
- id: ad.credential-dump.v1
  version: 1
  stage: execution
  triggers:
    - kind: observation_type
      types: ["domain_admin_access"]
  required_evidence_types:
    - "domain_admin_access"
  capabilities:
    - ad.credential_dump
  actions:
    - adapter: active_directory
      operation: credential_dump
      inputs:
        dump_method: "dcsync"
  limits:
    max_rate: 1
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 300
    max_output_bytes: 52428800
  stop_conditions:
    - "dump_complete"
    - "dump_failed"
    - "detected"
  success_emits:
    - "credential_dump_results"
    - "domain_hashes"
  next_playbooks:
    - objective.validation.v1
  report_sections:
    - "active_directory"
    - "validation"

# NTLM poisoning (Responder, Inveigh)
- id: ad.ntlm-poisoning.v1
  version: 1
  stage: execution
  triggers:
    - kind: observation_type
      types: ["foothold_established"]
  required_evidence_types:
    - "foothold_established"
  capabilities:
    - ad.ntlm_poisoning
  actions:
    - adapter: active_directory
      operation: ntlm_poisoning
      inputs:
        poison_protocols:
          - "llmnr"
          - "nbns"
          - "mdns"
        listen_minutes: 5
  limits:
    max_rate: 1
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 360
    max_output_bytes: 10485760
  stop_conditions:
    - "poisoning_complete"
    - "hash_captured"
    - "max_time_exceeded"
  success_emits:
    - "ntlm_hashes"
    - "challenge_messages"
  next_playbooks:
    - ad.ntlm-relay.v1
    - foothold.confirmation.v1
  report_sections:
    - "active_directory"
    - "validation"

# NTLM relay
- id: ad.ntlm-relay.v1
  version: 1
  stage: execution
  triggers:
    - kind: observation_type
      types: ["ntlm_hashes"]
  required_evidence_types:
    - "ntlm_hashes"
  capabilities:
    - ad.ntlm_relay
  actions:
    - adapter: active_directory
      operation: ntlm_relay
      inputs:
        relay_target: "auto"
        smb2_support: true
  limits:
    max_rate: 1
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 300
    max_output_bytes: 20971520
  stop_conditions:
    - "relay_complete"
    - "relay_successful"
    - "relay_failed"
  success_emits:
    - "relay_results"
    - "looted_hashes"
  next_playbooks:
    - foothold.confirmation.v1
  report_sections:
    - "active_directory"
    - "validation"

