# Ariadne Active Directory playbooks.
#
# Covers discovery, enumeration, and high-impact operations against
# Active Directory environments.  Discovery operations are lower-risk
# and use general AD capabilities; high-impact operations (credential
# dumping, relay attacks, ticket manipulation, etc.) each require
# their own exact capability and must pass the engagement policy.

# AD domain discovery — identify domain controller and realm
- id: ad.domain-discovery.v1
  version: 1
  stage: enumeration
  triggers:
    - kind: service_type
      types: ["ldap", "kerberos", "smb", "dns"]
  required_evidence_types:
    - "service_fingerprinted"
  capabilities:
    - ad.discovery
  actions:
    - adapter: active_directory
      operation: domain_discovery
      inputs: {}
  limits:
    max_rate: 10
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 60
    max_output_bytes: 5242880
  stop_conditions:
    - "domain_discovered"
    - "domain_not_found"
  success_emits:
    - "domain_info"
    - "domain_controller"
  next_playbooks:
    - ad.ldap-enumeration.v1
    - ad.smb-enumeration.v1
    - ad.kerberos-enumeration.v1
  report_sections:
    - "enumeration"
    - "active_directory"

