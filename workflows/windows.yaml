# WinPEAS sweep
- id: windows.winpeas.v1
  version: 1
  stage: privilege_escalation
  triggers:
    - kind: observation_type
      types: ["windows_host_info"]
  required_evidence_types:
    - "windows_host_info"
  capabilities:
    - exploit.payload_upload
    - privesc.windows.winpeas
  actions:
    - adapter: postex
      operation: winpeas
      inputs:
        timeout_seconds: 120
  limits:
    max_rate: 1
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 180
    max_output_bytes: 20971520
  stop_conditions:
    - "winpeas_complete"
    - "winpeas_privesc_found"
    - "max_time_exceeded"
  success_emits:
    - "winpeas_findings"
    - "privesc_path_identified"
  next_playbooks:
    - windows.privesccheck.v1
    - objective.validation.v1
  report_sections:
    - "privilege_escalation"
    - "windows"

