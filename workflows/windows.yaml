# Ariadne Windows post-exploitation playbooks.
#
# Provides playbooks for enumerating a compromised Windows host and
# identifying privilege escalation vectors.  Uses the ``postex``
# adapter with Windows-specific operations.

# Windows host enumeration — user/system information
- id: windows.host-enumeration.v1
  version: 1
  stage: post_exploitation
  triggers:
    - kind: os_type
      types: ["windows"]
  required_evidence_types:
    - "foothold_established"
  capabilities:
    - postex.windows.enum
  actions:
    - adapter: postex
      operation: identity
      inputs:
        source: "windows"
  limits:
    max_rate: 5
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 60
    max_output_bytes: 5242880
  stop_conditions:
    - "host_enumerated"
    - "access_lost"
  success_emits:
    - "windows_user_info"
    - "windows_host_info"
  next_playbooks:
    - windows.identity.v1
  report_sections:
    - "post_exploitation"
    - "windows"

# Windows identity and token privileges
- id: windows.identity.v1
  version: 1
  stage: post_exploitation
  triggers:
    - kind: observation_type
      types: ["windows_user_info"]
  required_evidence_types:
    - "windows_user_info"
  capabilities:
    - postex.windows.identity
  actions:
    - adapter: postex
      operation: identity
      inputs:
        detail: "full"
  limits:
    max_rate: 5
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 60
    max_output_bytes: 5242880
  stop_conditions:
    - "identity_abuse_checked"
  success_emits:
    - "windows_privileges"
    - "windows_groups"
  next_playbooks:
    - windows.token-abuse.v1
    - windows.services.v1
    - windows.scheduled-tasks.v1
  report_sections:
    - "post_exploitation"
    - "windows"

# Token privilege abuse (SeImpersonate, SeAssignPrimaryToken, etc.)
- id: windows.token-abuse.v1
  version: 1
  stage: privilege_escalation
  triggers:
    - kind: observation_type
      types: ["windows_privileges"]
  required_evidence_types:
    - "windows_privileges"
  capabilities:
    - privesc.windows.token
  actions:
    - adapter: postex
      operation: token_privileges
      inputs:
        check_abuse: true
  limits:
    max_rate: 5
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 60
    max_output_bytes: 5242880
  stop_conditions:
    - "token_abuse_checked"
    - "token_privesc_found"
  success_emits:
    - "token_abuse_vector"
    - "privesc_path_identified"
  next_playbooks:
    - windows.services.v1
    - windows.scheduled-tasks.v1
    - objective.validation.v1
  report_sections:
    - "privilege_escalation"
    - "windows"

