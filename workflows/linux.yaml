# Ariadne Linux post-exploitation playbooks.
#
# Provides playbooks for enumerating a compromised Linux host and
# identifying privilege escalation vectors.  Uses the ``postex``
# adapter with Linux-specific operations.

# Linux host enumeration — user/system information
- id: linux.host-enumeration.v1
  version: 1
  stage: post_exploitation
  triggers:
    - kind: os_type
      types: ["linux"]
  required_evidence_types:
    - "foothold_established"
  capabilities:
    - postex.linux.enum
  actions:
    - adapter: postex
      operation: identity
      inputs:
        source: "linux"
  limits:
    max_rate: 5
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 60
    max_output_bytes: 5242880
  stop_conditions:
    - "host_enumerated"
    - "access_lost"
  success_emits:
    - "linux_user_info"
    - "linux_host_info"
  next_playbooks:
    - linux.identity.v1
  report_sections:
    - "post_exploitation"
    - "linux"

# Linux identity and sudo abuse checks
- id: linux.identity.v1
  version: 1
  stage: post_exploitation
  triggers:
    - kind: observation_type
      types: ["linux_user_info"]
  required_evidence_types:
    - "linux_user_info"
  capabilities:
    - postex.linux.identity
  actions:
    - adapter: postex
      operation: identity
      inputs:
        detail: "full"
  limits:
    max_rate: 5
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 60
    max_output_bytes: 5242880
  stop_conditions:
    - "identity_abuse_checked"
  success_emits:
    - "sudo_privileges"
    - "user_groups"
  next_playbooks:
    - linux.sudo-abuse.v1
    - linux.suid-abuse.v1
    - linux.capabilities.v1
  report_sections:
    - "post_exploitation"
    - "linux"

# Sudo rule abuse
- id: linux.sudo-abuse.v1
  version: 1
