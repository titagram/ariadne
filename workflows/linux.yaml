  required_evidence_types:
    - "sudo_privileges"
  capabilities:
    - privesc.linux.sudo
  actions:
    - adapter: postex
      operation: sudo_rules
      inputs:
        check_abuse: true
  limits:
    max_rate: 5
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 60
    max_output_bytes: 5242880
  stop_conditions:
    - "sudo_abuse_checked"
    - "sudo_privesc_found"
  success_emits:
    - "sudo_abuse_vector"
    - "privesc_path_identified"
  next_playbooks:
    - linux.suid-abuse.v1
    - linux.capabilities.v1
    - objective.validation.v1
  report_sections:
    - "privilege_escalation"
    - "linux"

