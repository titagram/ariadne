# Ariadne web application testing playbooks.
#
# Covers the full web testing lifecycle: fingerprint, crawl, content
# discovery, passive scanning (ZAP), selected Nuclei templates,
# evidence-driven specialist testing, optional active ZAP scanning,
# validation, and report mapping.

# Web fingerprinting
- id: web.fingerprint.v1
  version: 1
  stage: enumeration
  triggers:
    - kind: service_type
      types: ["http", "https", "http-proxy"]
  required_evidence_types:
    - "service_fingerprinted"
  capabilities:
    - web.fingerprint
  actions:
    - adapter: httpx
      operation: scan
      inputs:
        follow_redirects: true
        max_redirects: 5
        tool_card:
          title: "ProjectDiscovery httpx"
          official_source_url: "https://docs.projectdiscovery.io/opensource/httpx/overview"
          source_date: "2026-07-30"
          summary: "Official HTTP probing toolkit used for bounded web fingerprinting."
  limits:
    max_rate: 50
    max_concurrency: 2
    max_attempts: 1
    max_duration_seconds: 120
    max_output_bytes: 10485760
  stop_conditions:
    - "all_endpoints_tested"
    - "target_unreachable"
  success_emits:
    - "web_technologies"
    - "web_redirect"
    - "web_title"
  next_playbooks:
    - web.content-discovery.v1
    - web.passive-zap.v1
    - web.http-fallback.v1
    - web.application-surface.v1
    - web.nuclei-selected.v1
  report_sections:
    - "enumeration"
    - "web"

# Web content discovery (directory/parameter fuzzing)
- id: web.content-discovery.v1
  version: 1
  stage: enumeration
  triggers:
    - kind: observation_type
      types: ["web_technologies"]
  required_evidence_types:
    - "web_technologies"
  capabilities:
    - web.content_discovery
  actions:
    - adapter: katana
      operation: crawl
      inputs:
        depth: 3
        duration_seconds: 90
        request_timeout: 20
        max_pages: 200
        tool_card:
          title: "ProjectDiscovery Katana"
          official_source_url: "https://docs.projectdiscovery.io/opensource/katana/overview"
          source_date: "2026-07-30"
          summary: "Official target-scoped crawler used for bounded endpoint discovery."
          version_args: ["-version"]
          help_args: ["-h"]
  limits:
    max_rate: 30
    max_concurrency: 2
    max_attempts: 1
    max_duration_seconds: 300
    max_output_bytes: 10485760
  stop_conditions:
    - "discovery_exhausted"
    - "max_duration_exceeded"
  success_emits:
    - "web_paths"
    - "web_parameters"
  next_playbooks:
    - web.object-reference.v1
    - web.passive-zap.v1
    - web.http-fallback.v1
    - web.application-surface.v1
    - web.nuclei-selected.v1
  report_sections:
    - "web"

# Minimal local fallback when a specialist crawler or passive scanner is
# unavailable. It fetches one already-confirmed target URL without redirects
# and extracts only same-host links and forms.
- id: web.http-fallback.v1
  version: 1
  stage: enumeration
  triggers:
    - kind: observation_type
      types: ["web_technologies"]
  required_evidence_types:
    - "web_technologies"
  capabilities:
    - web.content_discovery
  actions:
    - adapter: curl
      operation: fetch
      inputs:
        timeout: 20
        max_output: 1048576
        tool_card:
          title: "curl"
          official_source_url: "https://curl.se/docs/manpage.html"
          source_date: "2026-07-30"
          summary: "Official curl client used for a bounded same-host HTML fallback."
  limits:
    max_rate: 1
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 30
    max_output_bytes: 1048576
  stop_conditions:
    - "fallback_fetch_complete"
    - "target_unreachable"
  success_emits:
    - "web_paths"
    - "web_parameters"
  next_playbooks:
    - web.object-reference.v1
    - web.passive-zap.v1
    - web.application-surface.v1
    - web.nuclei-selected.v1
  report_sections:
    - "web"

# Passive ZAP scan
- id: web.passive-zap.v1
  version: 1
  stage: enumeration
  triggers:
    - kind: observation_type
      types: ["web_technologies", "web_paths"]
  required_evidence_types:
    - "web_technologies"
  capabilities:
    - web.passive_scan
  actions:
    - adapter: zap
      operation: passive_scan
      inputs:
        scan_type: "passive"
        tool_card:
          title: "OWASP ZAP"
          official_source_url: "https://www.zaproxy.org/docs/desktop/cmdline/"
          source_date: "2026-07-30"
          summary: "Official OWASP proxy used for bounded passive analysis."
          version_args: ["-version"]
          help_args: ["-help"]
  limits:
    max_rate: 20
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 180
    max_output_bytes: 10485760
  stop_conditions:
    - "passive_scan_complete"
    - "max_time_exceeded"
  success_emits:
    - "zap_alerts"
    - "zap_passive_alerts"
  next_playbooks:
    - web.application-surface.v1
    - web.nuclei-selected.v1
  report_sections:
    - "web"

# Bounded discovery of common application surfaces. Paths are deliberately
# generic and are requested only against the already observed target URL.
- id: web.application-surface.v1
  version: 1
  stage: enumeration
  triggers:
    - kind: observation_type
      types: ["web_technologies"]
  required_evidence_types:
    - "web_technologies"
  capabilities:
    - web.content_discovery
  actions:
    - adapter: curl
      operation: fetch
      inputs:
        path: "/admin"
        timeout: 10
        max_output: 524288
        tool_card:
          title: "curl"
          official_source_url: "https://curl.se/docs/manpage.html"
          source_date: "2026-07-30"
          summary: "Official curl client used for bounded application-surface discovery."
    - adapter: curl
      operation: fetch
      inputs:
        path: "/admin/login"
        timeout: 10
        max_output: 524288
        tool_card:
          title: "curl"
          official_source_url: "https://curl.se/docs/manpage.html"
          source_date: "2026-07-30"
          summary: "Official curl client used for bounded application-surface discovery."
    - adapter: curl
      operation: fetch
      inputs:
        path: "/login"
        timeout: 10
        max_output: 524288
        tool_card:
          title: "curl"
          official_source_url: "https://curl.se/docs/manpage.html"
          source_date: "2026-07-30"
          summary: "Official curl client used for bounded application-surface discovery."
    - adapter: curl
      operation: fetch
      inputs:
        path: "/api"
        timeout: 10
        max_output: 524288
        tool_card:
          title: "curl"
          official_source_url: "https://curl.se/docs/manpage.html"
          source_date: "2026-07-30"
          summary: "Official curl client used for bounded application-surface discovery."
    - adapter: curl
      operation: fetch
      inputs:
        path: "/version"
        timeout: 10
        max_output: 524288
        tool_card:
          title: "curl"
          official_source_url: "https://curl.se/docs/manpage.html"
          source_date: "2026-07-30"
          summary: "Official curl client used for bounded application-surface discovery."
  limits:
    max_rate: 5
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 60
    max_output_bytes: 2097152
  stop_conditions:
    - "application_surfaces_checked"
    - "target_unreachable"
  success_emits:
    - "web_paths"
  next_playbooks:
    - web.object-reference.v1
    - web.asset-analysis.v1
    - web.observed-endpoint.v1
    - web.nuclei-selected.v1
  report_sections:
    - "web"

# Fetch one already observed JavaScript/metadata asset and extract literal
# same-host routes from its contents. No arbitrary URLs are introduced.
- id: web.asset-analysis.v1
  version: 1
  stage: enumeration
  triggers:
    - kind: observation_type
      types: ["web_paths"]
  required_evidence_types:
    - "web_paths"
  capabilities:
    - web.content_discovery
  actions:
    - adapter: curl
      operation: fetch
      inputs:
        path_from_evidence: "static_asset"
        timeout: 15
        max_output: 1048576
        tool_card:
          title: "curl"
          official_source_url: "https://curl.se/docs/manpage.html"
          source_date: "2026-07-30"
          summary: "Official curl client used to inspect one observed static asset."
  limits:
    max_rate: 1
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 30
    max_output_bytes: 1048576
  stop_conditions:
    - "static_asset_inspected"
    - "target_unreachable"
  success_emits:
    - "web_paths"
    - "web_parameters"
  next_playbooks:
    - web.asset-analysis.v1
    - web.observed-endpoint.v1
    - web.object-reference.v1
    - web.nuclei-selected.v1
  report_sections:
    - "web"

# Fetch one non-static endpoint already observed in a target-bound response.
# This is deliberately narrower than directory fuzzing: no new path is
# invented, and each route is requested at most once while it is pending.
- id: web.observed-endpoint.v1
  version: 1
  stage: enumeration
  triggers:
    - kind: observation_type
      types: ["web_paths"]
  required_evidence_types:
    - "web_paths"
  capabilities:
    - web.content_discovery
  actions:
    - adapter: curl
      operation: fetch
      inputs:
        path_from_evidence: "observed_endpoint"
        timeout: 15
        max_output: 1048576
        tool_card:
          title: "curl"
          official_source_url: "https://curl.se/docs/manpage.html"
          source_date: "2026-07-30"
          summary: "Official curl client used to inspect one observed endpoint."
  limits:
    max_rate: 1
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 30
    max_output_bytes: 1048576
  stop_conditions:
    - "observed_endpoint_checked"
    - "target_unreachable"
  success_emits:
    - "web_paths"
    - "web_parameters"
  next_playbooks:
    - web.observed-endpoint.v1
    - web.object-reference.v1
    - web.nuclei-selected.v1
  report_sections:
    - "web"

# Selected Nuclei scanning
- id: web.nuclei-selected.v1
  version: 1
  stage: validation
  triggers:
    - kind: observation_type
      types: ["web_technologies"]
  required_evidence_types:
    - "web_technologies"
  capabilities:
    - web.nuclei_scan
  actions:
    - adapter: nuclei
      operation: scan
      inputs:
        tool_card:
          title: "Nuclei"
          official_source_url: "https://docs.projectdiscovery.io/tools/nuclei/overview"
          source_date: "2026-07-29"
          summary: "Template-based scanner used only with target-bound validated candidates."
  limits:
    max_rate: 30
    max_concurrency: 2
    max_attempts: 1
    max_duration_seconds: 180
    max_output_bytes: 10485760
  stop_conditions:
    - "nuclei_scan_complete"
    - "critical_finding_identified"
  success_emits:
    - "nuclei_web_alerts"
    - "vulnerability_candidate"
  next_playbooks:
    - web.specialist-testing.v1
  report_sections:
    - "web"
    - "validation"

# Evidence-driven specialist testing (sqlmap, dalfox, testssl.sh)
- id: web.specialist-testing.v1
  version: 1
  stage: validation
  triggers:
    - kind: observation_type
      types: ["vulnerability_candidate"]
  required_evidence_types:
    - "vulnerability_candidate"
  capabilities:
    - web.specialist_test
  actions:
    - adapter: nmap
      operation: service_fingerprint
      inputs:
        protocol: "http"
        version_intensity: "9"
  limits:
    max_rate: 10
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 120
    max_output_bytes: 5242880
  stop_conditions:
    - "specialist_testing_complete"
    - "vulnerability_confirmed"
    - "no_relevant_specialist"
  success_emits:
    - "specialist_findings"
    - "vulnerability_validated"
  next_playbooks:
    - web.active-zap.v1
    - web.validation.v1
  report_sections:
    - "web"
    - "validation"

# Optional active ZAP scan
- id: web.active-zap.v1
  version: 1
  stage: validation
  triggers:
    - kind: observation_type
      types: ["vulnerability_candidate"]
  required_evidence_types:
    - "vulnerability_candidate"
  capabilities:
    - web.active_scan
  actions:
    - adapter: zap
      operation: active_scan
      inputs:
        scan_type: "active"
        max_attack_duration_seconds: 600
        tool_card:
          title: "OWASP ZAP"
          official_source_url: "https://www.zaproxy.org/docs/desktop/cmdline/"
          source_date: "2026-07-30"
          summary: "Official OWASP proxy used for bounded active validation."
          version_args: ["-version"]
          help_args: ["-help"]
  limits:
    max_rate: 10
    max_concurrency: 1
    max_attempts: 1
    max_duration_seconds: 600
    max_output_bytes: 20971520
  stop_conditions:
    - "active_scan_complete"
    - "max_time_exceeded"
    - "vulnerability_confirmed"
  success_emits:
    - "zap_active_alerts"
    - "vulnerability_validated"
  next_playbooks:
    - web.validation.v1
  report_sections:
    - "web"
    - "validation"

# Web validation — capture proof of exploitation
- id: web.validation.v1
  version: 1
  stage: validation
  triggers:
    - kind: observation_type
      types: ["vulnerability_validated"]
  required_evidence_types:
    - "vulnerability_validated"
  capabilities:
    - exploit.validation
  actions:
    - adapter: screenshot
      operation: capture
      inputs:
        proof_kind: "web_exploit"
        tool_card:
          title: "Chromium"
          official_source_url: "https://www.chromium.org/developers/how-tos/run-chromium-with-flags/"
          source_date: "2026-07-29"
          summary: "Headless browser used for bounded evidence screenshots."
  limits:
    max_rate: 1
    max_concurrency: 1
    max_attempts: 2
    max_duration_seconds: 60
    max_output_bytes: 5242880
  stop_conditions:
    - "web_exploit_confirmed"
    - "web_exploit_failed"
  success_emits:
    - "vulnerability_validated"
    - "web_exploit_proof"
  next_playbooks:
    - foothold.confirmation.v1
  report_sections:
    - "web"
    - "validation"
