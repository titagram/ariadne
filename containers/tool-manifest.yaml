  - kali-linux-headless
  - nmap
  - curl
  - wget
  - netcat-openbsd
  - dnsutils
  - openssh-client
  - python3
  - python3-pip
  - git
  - jq
  - sqlmap
  - hydra
  - john
  - hashcat
  - wordlists
  - dirb
  - gobuster
  - nikto
  - enum4linux-ng
  - smbclient
  - impacket-scripts
  - bloodhound
  - bloodhound.py
  - certipy
  - ldapscripts
  - rpcbind
  - nfs-common
  - metasploit-framework
  - exploitdb
  - searchsploit
  - wireshark
  - tcpdump
  - net-tools
  - iproute2
  - iptables
  - nftables
