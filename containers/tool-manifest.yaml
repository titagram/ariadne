# Ariadne Kali container tool manifest.
# The image starts from official minimal kali-rolling and installs only these
# curated packages. Bulk Kali metapackages and GUI frontends do not belong
# here. The host's lock file is the authoritative base-image reference.
packages:
  # Runtime and bounded process support
  - ca-certificates
  - curl
  - git
  - iproute2
  - iputils-ping
  - jq
  - dnsutils
  - netcat-openbsd
  - openssh-client
  - procps
  - python3

  # Discovery and service enumeration
  - nmap
  - httpx-toolkit
  - ffuf
  - gobuster
  - nikto
  - sqlmap
  - hydra
  - john

  # Research, validation, and controlled exploitation
  - exploitdb
  - nuclei
  - metasploit-framework
  - zaproxy

  # Active Directory and Windows-facing collection
  - smbclient
  - ldap-utils
  - nfs-common
  - impacket-scripts
  - bloodhound.py
  - certipy-ad
  - netexec
  - responder
  - bloodyad

  # Pivoting and packet-level evidence
  - chisel
  - ligolo-ng
  - tcpdump
  - tshark

  # Headless evidence capture for the reporting workflow
  - chromium

executables:
  - bloodhound-python
  - bloodyad
  - certipy-ad
  - chisel
  - chromium
  - curl
  - ffuf
  - git
  - gobuster
  - httpx-toolkit
  - hydra
  - impacket-GetNPUsers
  - impacket-lookupsid
  - impacket-ntlmrelayx
  - impacket-secretsdump
  - impacket-smbexec
  - impacket-ticketer
  - impacket-wmiexec
  - ip
  - john
  - jq
  - katana
  - ldapsearch
  - ligolo-proxy
  - msfconsole
  - netexec
  - nikto
  - nmap
  - nuclei
  - ping
  - pkill
  - responder
  - searchsploit
  - smbclient
  - sqlmap
  - ssh
  - tcpdump
  - tshark
  - zaproxy

external_binaries:
  katana:
    version: "1.6.1"
    source: "https://github.com/projectdiscovery/katana/releases/tag/v1.6.1"
    sha256:
      amd64: "503754f1bd370c3ef287df6998e317baed2dd75bdd13ea64034f09b80ca393f3"
      arm64: "663b4ed2c6559a7dacc819e816889940d567ff554ac3f543c8c8f9b50245cd45"

nuclei_templates:
  repository: "https://github.com/projectdiscovery/nuclei-templates"
  revision: "9979ce144c257f1c427a75604f8c0ffbc8293390"
  index_sha256: "c8b69adb4b906eba5e9d9239f1d775d8175739a8bc263073243b0f0c129c74f9"
  container_path: "/opt/nuclei-templates"

# Post-exploitation tools (PEASS-ng, pspy, PrivescCheck, Seatbelt)
postex_binaries:
  linpeas:
    url: "https://github.com/peass-ng/PEASS-ng/releases/download/20250101/linpeas.sh"
    version: "20250101"
    license: "GPL-2.0"
    arch: "linux/amd64"
    container_path: "/opt/tools/linpeas.sh"
  pspy:
    url: "https://github.com/DominicBreuker/pspy/releases/download/v1.2.1/pspy64"
    version: "1.2.1"
    license: "MIT"
    arch: "linux/amd64"
    container_path: "/opt/tools/pspy64"
  winpeas:
    url: "https://github.com/peass-ng/PEASS-ng/releases/download/20250101/winPEASx64.exe"
    version: "20250101"
    license: "GPL-2.0"
    arch: "windows/amd64"
    container_path: "/opt/tools/winPEASx64.exe"
  privesccheck:
    url: "https://raw.githubusercontent.com/itm4n/PrivescCheck/refs/heads/master/PrivescCheck.ps1"
    version: "latest"
    license: "MIT"
    arch: "windows/any"
    container_path: "/opt/tools/PrivescCheck.ps1"
  seatbelt:
    url: "https://github.com/GhostPack/Seatbelt/releases/download/v1.0.0/Seatbelt.exe"
    version: "1.0.0"
    license: "BSD-3-Clause"
    arch: "windows/amd64"
    container_path: "/opt/tools/Seatbelt.exe"
