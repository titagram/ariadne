# Ariadne Docker Compose — pinned Kali and netguard egress firewall.
#
# Kali shares netguard's network namespace so all egress passes through
# nftables rules. Only netguard carries NET_ADMIN.
# The Docker socket is deliberately not mounted into any container.
name: ariadne

services:
  netguard:
    image: ${ARIADNE_NETGUARD_IMAGE:-ariadne-netguard:local-build}
    pull_policy: never
    build:
      context: .
      dockerfile: netguard/Dockerfile
      args:
        NETGUARD_BASE_REF: ${NETGUARD_BASE_REF:-sha256:e7a1a92a5bfeee40966aea60f0796b0e7917cc35591542701834f03a68fa3d18}
    cap_add:
      - NET_ADMIN
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - ./netguard/entrypoint.sh:/entrypoint.sh:ro
    environment:
      - ARIADNE_ALLOW_TARGETS=${ARIADNE_ALLOW_TARGETS:-}
      - ARIADNE_MSF_CALLBACK_TARGET=${ARIADNE_MSF_CALLBACK_TARGET:-}
      - ARIADNE_MSF_CALLBACK_LISTENER_PORT=${ARIADNE_MSF_CALLBACK_LISTENER_PORT:-}
    restart: "no"

  kali:
    image: ${ARIADNE_KALI_IMAGE:-ariadne-kali:local-build}
    pull_policy: never
    command: ["sleep", "infinity"]
    build:
      context: .
      dockerfile: kali/Dockerfile
      args:
        KALI_BASE_REF: ${KALI_BASE_REF:-sha256:2951c3e7760bf1d85e1475dafcc5ea8a637fc53e14e84dd9638dd5d1d6fe843b}
        NUCLEI_TEMPLATES_REF: ${NUCLEI_TEMPLATES_REF:-9979ce144c257f1c427a75604f8c0ffbc8293390}
        KATANA_VERSION: ${KATANA_VERSION:-1.6.1}
        KATANA_AMD64_SHA256: ${KATANA_AMD64_SHA256:-503754f1bd370c3ef287df6998e317baed2dd75bdd13ea64034f09b80ca393f3}
        KATANA_ARM64_SHA256: ${KATANA_ARM64_SHA256:-663b4ed2c6559a7dacc819e816889940d567ff554ac3f543c8c8f9b50245cd45}
    network_mode: "service:netguard"
    read_only: true
    depends_on:
      - netguard
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ${ARIADNE_RUN_DIR:?ARIADNE_RUN_DIR is required}:/engagement:ro
      - ${ARIADNE_RUN_DIR:?ARIADNE_RUN_DIR is required}/workspace:/workspace
      - ${ARIADNE_RUN_DIR:?ARIADNE_RUN_DIR is required}/artifacts:/evidence
      - ../src/ariadne/catalog/nuclei:/opt/ariadne-catalog/nuclei:ro
    environment:
      - ENGAGEMENT_DIR=/engagement
      - EVIDENCE_DIR=/evidence
      - HOME=/workspace/home
      - JAVA_TOOL_OPTIONS=-Duser.home=/workspace/home
    restart: "no"
