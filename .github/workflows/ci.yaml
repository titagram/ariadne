# Ariadne CI — runs on push and pull_request to main.
#
# Jobs (in dependency order):
#   lint-type          Ruff lint + ty type check on src
#   unit               Unit, policy-negative, and adapter-contract tests
#   integration        Integration tests (Docker Compose, Linux amd64)
#   report-golden      Report rendering and SysReptor bundle contract tests
#   e2e                End-to-end acceptance tests (non-Docker bound)
#
# The integration job uses an isolated Docker network with no Internet
# egress; it publishes no service outside loopback.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  RUFF_VERSION: "0.15.10"

jobs:
  lint-type:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --only-dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ty type check
        run: uv run ty check src

  unit:
    name: Unit & Policy & Contract Tests
    needs: lint-type
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Policy-negative tests
        run: uv run pytest tests/policy -v

      - name: Contract tests
        run: uv run pytest tests/contract -v

  integration:
    name: Integration (Linux amd64)
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Start integration Compose stack
        run: |
          docker compose -f tests/integration/compose.yaml up -d --wait --wait-timeout 60
          docker compose -f tests/integration/compose.yaml ps

      - name: Integration tests
        run: uv run pytest tests/integration -v -m integration

      - name: Teardown
        if: always()
        run: docker compose -f tests/integration/compose.yaml down -v

  report-golden:
    name: Report Golden Tests
    needs: lint-type
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Report rendering tests
        run: uv run pytest tests/unit/test_report_validation.py tests/contract/test_sysreptor_bundle.py tests/contract/test_sysreptor_push.py -v

  e2e:
    name: End-to-End Acceptance
    needs: [unit, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: E2E tests
        run: uv run pytest tests/e2e -v -m e2e

      - name: Git diff whitespace check
        run: git diff --check
