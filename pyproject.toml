[project]
name = "ariadne"
version = "0.2.0"
description = "Policy-bounded lab and CTF pentesting plugin for Hades"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Gabriele" }]
dependencies = [
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "hypothesis",
    "ruff==0.15.10",
    "ty==0.0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ariadne"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The root __init__.py is the Hades plugin bootstrap: it must insert src/ into
# sys.path before importing ariadne.composition, so the late import (E402) and
# the stdlib import order (I001) are intentional and load-bearing.
"__init__.py" = ["E402", "I001"]

[tool.ty.rules]
# The plan-mandated Hades adapter interface types ctx as `object` (duck-typed
# against Hades' runtime-provided PluginContext, which is not an importable
# dependency of this plugin). Attribute access on ctx is therefore intentional;
# unresolved-attribute is downgraded to warn so `ty check src` stays green.
unresolved-attribute = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The repo root __init__.py is the Hades plugin bootstrap (it prepends src/ and
# re-exports register). With tests/__init__.py present, pytest's default
# "prepend" import mode would treat the repo root as the `ariadne` package and
# execute the bootstrap during collection, breaking src/ imports. importlib
# mode imports test modules without walking parent packages.
addopts = "--import-mode=importlib"
# With the repo root __init__.py present (the Hades plugin bootstrap), pytest's
# package walk would name test modules `ariadne.tests...` and execute the
# bootstrap as top-level package `ariadne`, which then self-shadows src/ariadne.
# Namespace-package consideration makes pytest probe importability and fall back
# to the rootdir-anchored name `tests.unit.*`, which never executes the root
# bootstrap during collection.
consider_namespace_packages = true
markers = [
    "e2e: end-to-end acceptance tests that exercise the full plugin pipeline",
    "integration: tests that require a running Docker Compose stack",
]
